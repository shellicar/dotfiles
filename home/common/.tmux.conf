set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 25

# terminal title: server (socket label) » session » window
set -g set-titles on
set -g set-titles-string "#{b:socket_path} » #S » #{b:pane_current_path}"


set -g set-clipboard on
set -g allow-passthrough off
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux-copy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux-copy"

bind-key -n DoubleClick1Pane copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "tmux-copy"
bind-key -n TripleClick1Pane copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "tmux-copy"

# process
set-hook -g session-closed 'run-shell "tmux list-panes -t #{session_name} -F \"#{pane_pid}\" | xargs -r kill -TERM"'
set-hook -g pane-focus-in 'run-shell "~/dotfiles/.local/bin/tmux-vscode-workspace.sh"'
set -g focus-events on

# mouse
set -g mouse on
bind-key -n MouseDrag1Pane copy-mode -M
# set -g mouse-select-window on
# set -g mouse-select-pane on
# set -g mouse-resize-pane on

# reload config
bind r source-file ~/.tmux.conf

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# choose-tree (prefix-s / prefix-w) — pure tmux format, no shell out (per-row
# subprocess spawning is too slow). Three branches selected by tmux's row-type
# booleans (#{session_format} / #{window_format} / #{pane_format}). Pieces are
# stored as user options for readability; the bind composes them. The window
# and pane rows reuse the status bar's @ws-* pieces, defined further down; a
# piece is expanded when a row is drawn, so the order does not matter.
# @ct-cmd is @ws-cmd without the cut: a Claude Code pane shows its whole
# session name.
set -g @ct-cmd "#{?#{==:#{pane_current_command},claude},#{s/^[^ ]* //:pane_title},#{pane_current_command}}"
set -g @ct-session-fmt "#{session_windows} windows#{?session_attached, (attached),}"
set -g @ct-window-fmt "#{E:@ws-glyph}#{E:@ws-title}#[fg=colour250]: #{E:@ct-cmd}#[default]"
set -g @ct-pane-fmt "#{E:@ws-glyph}#[fg=colour250]#{E:@ct-cmd}#[default]"
bind s choose-tree -Zs -F "#{?session_format,#{E:@ct-session-fmt},#{?window_format,#{E:@ct-window-fmt},#{E:@ct-pane-fmt}}}"
bind w choose-tree -Zw -F "#{?session_format,#{E:@ct-session-fmt},#{?window_format,#{E:@ct-window-fmt},#{E:@ct-pane-fmt}}}"

# resize panes
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5

# Tab: back to the last pane, in any window or session. last-window has no key
# now; l is taken by the resize bindings above.
# [1] leaves the pane-focus-in hook on line 21 in place. Keep that line above
# this one: re-sourcing runs it first, and it replaces every index.
set-hook -g 'pane-focus-in[1]' 'if -F "#{!=:#{pane_id},#{@cur-pane}}" "set -gF @prev-pane \"#{@cur-pane}\" ; set -gF @cur-pane \"#{pane_id}\""'
# run-shell expands the format; switch-client -t reads the raw string as a
# session name.
bind Tab run-shell 'tmux switch-client -t "#{@prev-pane}"'

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

######################
### DESIGN CHANGES ###
######################


## Status bar design
# Status line
set -g status-justify left
set -g status-interval 1

# Messaging
set -g message-command-style fg=blue,bg=black



# Info on left (I don't have a session display for now)
set -g status-left ''

# Loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action any

# The modes
setw -g clock-mode-colour colour135
setw -g mode-style bold,fg=colour196,bg=colour238

# The panes
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour51,bg=colour236

# The statusbar
set -g status-position bottom
set -g status-style fg=colour245,bg=default
# Two warning segments sit before the clock, each a pure tmux format so the bar
# needs no socket and keeps rendering even after a server's socket is deleted
# (the server draws its own bar). Each style is space-separated rather than
# comma-separated, because #{?...} separates its branches with commas.
#
# 1. "snapshot failed": a save that ran and failed. `tmux show -sv @snapshot-error`
#    prints why; a save that works unsets it.
# 2. "SNAPSHOT STALE": no recent save, so autosave has stopped (the sweep crashed,
#    the timer is off, the socket was deleted). Computed as now - last > 600,
#    where last is @snapshot-last-save or, before the first save, #{start_time}
#    (so a server still in its first-save window is not flagged). 600 is
#    2 * INTERVAL, with INTERVAL = 300 in .local/bin/tmux-snapshot-sweep; keep in
#    step. %s is now: tmux runs the template through strftime before expanding
#    formats, so %s and #{e|...} math compose. The warning is gated on the server
#    being non-trivial (more than one window or more than one pane), mirroring
#    save's own single-pane refusal: a trivial server is never saved, so an
#    always-stale time is expected and must not warn. The bar sees the current
#    session's counts, which is enough: an unset @snapshot-last-save coincides
#    only with a genuinely trivial server.
set -g status-right '#{?@snapshot-error,#[fg=colour255 bg=colour160 bold] snapshot failed ,}#{?#{&&:#{e|>:#{e|-:%s,#{?@snapshot-last-save,#{@snapshot-last-save},#{start_time}}},600},#{||:#{e|>:#{session_windows},1},#{e|>:#{window_panes},1}}},#[fg=colour255 bg=colour166 bold] SNAPSHOT STALE ,}#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
# Room for both warnings and the clock at once (17 + 16 + 17 characters).
set -g status-right-length 60
set -g status-left-length 20

setw -g window-status-current-style fg=colour255,bg=default,underscore
# Window status, pure tmux format with no #() shell-out: a format job re-runs on
# a status-interval timer, not on the event that changed the value, so anything
# shelled out here can only ever be polled.
#
# A window reads <glyph><folder>.<window>.<pane>:<command><flags>.
#
# The prompt writes the pane title as a two-field channel, "<glyph> <folder>",
# where folder is the .git-root basename of the shell's own cwd. It is pushed by
# printf alone, so the bar updates on the write rather than on a tick. Reading
# the shell's cwd rather than the pane's keeps the folder steady while a child
# chdirs as it runs, which is what find does as it walks. A title whose first
# field is not one of our glyphs belongs to an application, so neither field is
# used and the folder falls back to the cwd basename.
set -g @ws-head "#{s/ .*//:pane_title}"
set -g @ws-tail "#{s/^[^ ]* //:pane_title}"
set -g @ws-mine "#{&&:#{m:* *,#{pane_title}},#{||:#{==:#{E:@ws-head},⏳},#{||:#{==:#{E:@ws-head},✅},#{==:#{E:@ws-head},❌}}}}"
set -g @ws-glyph "#{?#{E:@ws-mine},#{E:@ws-head} ,}"
set -g @ws-folder "#{?#{E:@ws-mine},#{E:@ws-tail},#{?#{pane_path},#{b:pane_path},#{b:pane_current_path}}}"
set -g @ws-title "#[fg=colour81]#{E:@ws-folder}"
# Claude Code titles its pane "<glyph> <session name>", so the command slot
# shows that name, cut to 16 characters.
set -g @ws-cmd "#{?#{==:#{pane_current_command},claude},#{s/^[^ ]* //;=/16/…:pane_title},#{pane_current_command}}"

setw -g window-status-current-format "#{E:@ws-glyph}#{E:@ws-title}#[fg=colour250].#{window_index}.#{pane_index}:#[fg=colour255]#{E:@ws-cmd}#[fg=colour50]#{p1:window_flags}"
setw -g window-status-format         "#{E:@ws-glyph}#{E:@ws-title}#[fg=colour244].#{window_index}.#{pane_index}:#[fg=colour250]#{E:@ws-cmd}#[fg=colour244]#{p1:window_flags}"


setw -g window-status-style fg=colour250,bg=default

setw -g window-status-bell-style bold,fg=colour255,bg=colour1

# The messages
set -g message-style bold,fg=colour232,bg=colour166

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -as terminal-features ',xterm*:extkeys'
set -s extended-keys always
set -s extended-keys-format csi-u

set-environment -g LANG C.UTF-8

# Autosave is not started from here any more. It is .local/bin/tmux-snapshot-sweep,
# run every INTERVAL by the OS scheduler (a systemd --user timer on WSL, a launchd
# LaunchAgent on macOS), so it survives a crash and self-heals. The old per-server
# watcher launched by run-shell had nothing to respawn it and nothing to show when
# it died; "SNAPSHOT STALE" above is now how a stopped autosave surfaces.

# VS16 emoji (ℹ️ ❤️ ⚠️): the always-wide default disagrees with iTerm2's
# widths, corrupting lines on scroll/mouse redraw (two-position bug).
set -s variation-selector-always-wide off
