set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 25

# terminal title: server (socket label) » session » window
set -g set-titles on
set -g set-titles-string "#{b:socket_path} » #S » #{?#{@title},#{@title},#{b:pane_current_path}}"


set -g set-clipboard on
set -g allow-passthrough off
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux-copy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux-copy"

bind-key -n DoubleClick1Pane copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "tmux-copy"
bind-key -n TripleClick1Pane copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "tmux-copy"

# process
set-hook -g session-closed 'run-shell "tmux list-panes -t #{session_name} -F \"#{pane_pid}\" | xargs -r kill -TERM"'
set-hook -g pane-focus-in 'run-shell "~/dotfiles/.local/bin/tmux-vscode-workspace.sh"'
set -g focus-events on

# mouse
set -g mouse on
bind-key -n MouseDrag1Pane copy-mode -M
# set -g mouse-select-window on
# set -g mouse-select-pane on
# set -g mouse-resize-pane on

# reload config
bind r source-file ~/.tmux.conf

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# choose-tree (prefix-s / prefix-w) — pure tmux format, no shell out (per-row
# subprocess spawning is too slow). Three branches selected by tmux's row-type
# booleans (#{session_format} / #{window_format} / #{pane_format}). Pieces are
# stored as user options for readability; the bind composes them.
set -g @ct-session-fmt "#{session_windows} windows#{?session_attached, (attached),}"
set -g @ct-window-fmt "#{?#{@status},#{@status} ,}#[fg=#{?#{@colour},#{@colour},colour250}]#{?#{@title},#{@title},#{b:pane_current_path}}#{?#{@role}, #[fg=colour209]#{@role},}#{?#{@state}, #[fg=colour141][#{@state}],}#[default]"
set -g @ct-pane-fmt "#{?#{@status},#{@status} ,}#{?#{@role},#[fg=colour209]#{@role},#[fg=colour250]#{pane_current_command}}#[default]"
bind s choose-tree -Zs -F "#{?session_format,#{E:@ct-session-fmt},#{?window_format,#{E:@ct-window-fmt},#{E:@ct-pane-fmt}}}"
bind w choose-tree -Zw -F "#{?session_format,#{E:@ct-session-fmt},#{?window_format,#{E:@ct-window-fmt},#{E:@ct-pane-fmt}}}"

# resize panes
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

######################
### DESIGN CHANGES ###
######################


## Status bar design
# Status line
set -g status-justify left
set -g status-interval 1

# Messaging
set -g message-command-style fg=blue,bg=black



# Info on left (I don't have a session display for now)
set -g status-left ''

# Loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action any

# The modes
setw -g clock-mode-colour colour135
setw -g mode-style bold,fg=colour196,bg=colour238

# The panes
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour51,bg=colour236

# The statusbar
set -g status-position bottom
set -g status-style fg=colour245,bg=default
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style fg=colour255,bg=default,underscore
# Window status, pure tmux format with no #() shell-out: a format job re-runs on
# a status-interval timer, not on the event that changed the value, so anything
# shelled out here can only ever be polled.
#
# Slots, each overridable by a user option:
#   @title  (window) replaces the folder slot   @colour (window) its fg
#   @state  (window) appended in brackets
#   @role   (pane)   replaces the process slot  @status (pane) glyph prefix
#
# The prompt writes the pane title as a two-field channel, "<glyph> <folder>",
# where folder is the .git-root basename of the shell's own cwd. It is pushed by
# printf alone, so the bar updates on the write rather than on a tick. Reading
# the shell's cwd rather than the pane's keeps the folder steady while a child
# chdirs as it runs, which is what find does as it walks. A title whose first
# field is not one of our glyphs belongs to an application, so neither field is
# used and the folder falls back to the cwd basename.
set -g @ws-head "#{s/ .*//:pane_title}"
set -g @ws-tail "#{s/^[^ ]* //:pane_title}"
set -g @ws-mine "#{&&:#{m:* *,#{pane_title}},#{||:#{==:#{E:@ws-head},⏳},#{||:#{==:#{E:@ws-head},✅},#{==:#{E:@ws-head},❌}}}}"
set -g @ws-glyph "#{?#{@status},#{@status} ,#{?#{E:@ws-mine},#{E:@ws-head} ,}}"
set -g @ws-folder "#{?#{E:@ws-mine},#{E:@ws-tail},#{?#{pane_path},#{b:pane_path},#{b:pane_current_path}}}"
set -g @ws-title "#[fg=#{?#{@colour},#{@colour},colour81}]#{?#{@title},#{@title},#{E:@ws-folder}}"
set -g @ws-state "#{?#{@state}, #[fg=colour141][#{@state}],}"

setw -g window-status-current-format "#{E:@ws-glyph}#{E:@ws-title}#[fg=colour250].#{window_index}.#{pane_index}:#{?#{@role},#[fg=colour209]#{@role},#[fg=colour255]#{pane_current_command}}#{E:@ws-state}#[fg=colour50]#{p1:window_flags}"
setw -g window-status-format         "#{E:@ws-glyph}#{E:@ws-title}#[fg=colour244].#{window_index}.#{pane_index}:#{?#{@role},#[fg=colour209]#{@role},#[fg=colour250]#{pane_current_command}}#{E:@ws-state}#[fg=colour244]#{p1:window_flags}"


setw -g window-status-style fg=colour250,bg=default

setw -g window-status-bell-style bold,fg=colour255,bg=colour1

# The messages
set -g message-style bold,fg=colour232,bg=colour166

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -as terminal-features ',xterm*:extkeys'
set -s extended-keys always
set -s extended-keys-format csi-u

set-environment -g LANG C.UTF-8

# periodic snapshot: one watcher per server, saves every @snapshot-save-interval seconds
set -g @snapshot-save-interval '300'
run-shell -b '$HOME/bin/tmux-snapshot-watch #{b:socket_path}'

# VS16 emoji (ℹ️ ❤️ ⚠️): the always-wide default disagrees with iTerm2's
# widths, corrupting lines on scroll/mouse redraw (two-position bug).
set -s variation-selector-always-wide off
